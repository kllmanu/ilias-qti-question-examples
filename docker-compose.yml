services:
    ilias:
        image: srsolutions/ilias
        ports:
          - 8080:80
        links:
          - mysql
        environment:
          - ILIAS_AUTO_SETUP=1
          - ILIAS_DB_USER=root
          - ILIAS_DB_PASSWORD=example
          - ILIAS_MEMORY_LIMIT=2G
    mysql:
        image: mariadb
        command: |
            --character-set-server=utf8
            --collation-server=utf8_general_ci
        environment:
          - MYSQL_ROOT_PASSWORD=example
          - MYSQL_DATABASE=ilias

